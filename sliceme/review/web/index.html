<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>sliceme review</title>
		<link rel="stylesheet" href="/style.css" />
	</head>
	<body>
		<header id="topbar">
			<div id="identity">
				<strong id="target-name">sliceme review</strong>
				<select id="campaign-select" aria-label="Campaign" hidden></select>
				<span id="tips" class="tips"></span>
				<span id="approval-state" class="muted"></span>
				<span id="stale" class="stale" role="status" hidden></span>
			</div>
			<div id="decisions">
				<button id="approve-all" type="button">Approve all</button>
				<button id="deliver" type="button" hidden>Deliver</button>
			</div>
		</header>

		<main>
			<aside id="left" aria-label="Commits">
				<h2>Commits</h2>
				<div id="commit-list" class="file-tree"></div>
				<h2>Files</h2>
				<div id="file-tree" class="file-tree"></div>
			</aside>

			<section id="center" aria-label="Diff">
				<div id="center-header">
					<div id="diff-header" class="muted"></div>
					<button id="view-toggle" type="button" hidden>Preview</button>
				</div>
				<div id="diff" class="diff"></div>
				<div id="report" class="report markdown" hidden></div>
				<div id="preview" class="report markdown" hidden></div>
			</section>

			<aside id="right" aria-label="Review">
				<section>
					<h2>Evidence</h2>
					<div id="evidence" class="evidence"></div>
				</section>
				<section>
					<div class="section-head">
						<h2>
							Comments <span id="comment-count" class="muted"></span>
						</h2>
						<button
							id="comment-add"
							type="button"
							title="Comment on the whole change, not one line"
						>
							Add comment
						</button>
					</div>
					<div id="comments" class="comments"></div>
					<form id="comment-form" hidden>
						<div id="comment-anchor" class="muted"></div>
						<textarea
							id="comment-body"
							placeholder="Write a comment…"
							rows="3"
							aria-label="Comment body"
						></textarea>
						<div class="row">
							<button type="submit">Comment</button>
							<button type="button" id="comment-cancel">Cancel</button>
						</div>
					</form>
				</section>
			</aside>
		</main>

		<footer id="statusbar" class="muted"></footer>
		<div id="notice" class="notice" role="status" aria-live="polite" hidden></div>

		<script type="module" src="/app.js"></script>
	</body>
</html>
